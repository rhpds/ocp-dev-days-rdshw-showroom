source_language: en
target_languages:
  ja:
    name: Japanese
    native_name: 日本語
    flag: "\U0001F1EF\U0001F1F5"
    antora_display_version: 日本語
  es:
    name: Spanish
    native_name: Español
    flag: "\U0001F1EA\U0001F1F8"
    antora_display_version: Español
# Files that should never be translated (relative to modules/ROOT/).
# These are purely technical: CSS/JS passthrough, attribute definitions,
# SVG icons, HTML figure templates. They are copied verbatim from en/.
skip_patterns:
  - "partials/**"
  - "pages/module-*/_shared/**"
  - "pages/module-*/_figures/**"
  - "pages/module-*/m*/_figures/**"
# Technical terms to preserve in English across all translations.
preserve_terms:
  - OpenShift Dev Day Roadshow
  - OpenShift
  - Red Hat
  - Kubernetes
  - Argo CD
  - GitOps
  - Developer Hub
  - Dev Spaces
  - Lightspeed
  - Parasol Insurance
