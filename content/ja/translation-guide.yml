# 日本語翻訳ガイド (翻訳ルール + 用語集)
#
# このファイルはAntoraのビルド対象外（ページとしてレンダリングされない）です。
# 日本語翻訳における一般ルールと、用語の統一ルール・判断理由を記録するためのものです。
# 新しいルールや用語の表記ゆれが見つかった場合は、ここに追記してください。

# ------------------------------------------------------------------
# 翻訳ルール
# ------------------------------------------------------------------
# 各エントリーの項目:
#   rule:  ルールの内容
#   why:   理由
#   where: 適用範囲・具体例
rules:
  - rule: チャットボット / AIエージェントへの入力文・出力文は英語のまま残す。
    why: >-
      [.copypaste.value] ブロックでユーザーが実際にコピペして送信する文字列と、
      :fig-user-msg: / :fig-bot-msg: 属性（スクリーンショットのモックアップに表示される文言）は、
      実際にアプリが処理する/応答する文字列と一致している必要がある。
      日本語に翻訳すると、ハードコードされたダミー応答（例: 常に "Hello World" を返す）の
      教育上の意図が壊れたり、LLMへの実際の入力と食い違ったりする。
    where: module-03/m3.3.adoc, m4.2.adoc, m5.3.adoc, m5.4.adoc など、
      Matrix/Rocket.Chatのやり取りや AI エージェントとの対話を扱う箇所全般。

  - rule: コード・コマンド・設定ファイルの中身は翻訳しない。
    why: 実行時にそのまま使われるリテラルであり、翻訳すると動作しなくなる。
    where: >-
      [source,...] ブロック、[.copypaste] ブロック（チャット向けを除く）、
      YAMLのキー名・値（例: `namespace: shared-database`）、
      CLIのフラグ名（例: `--connect-timeout`）、ログ/ターミナル出力例、
      AsciiDocのアンカーID（[id='...']、[#...]）、mermaid図のノードID。

  - rule: UIモックアップ内の文言（ボタンラベル・画面テキスト）は、実際のUI表記に合わせて翻訳しない。
    why: >-
      pass:[...] で埋め込まれたHTMLモックアップは実際のアプリ画面を模しており、
      アプリ自体が英語UIである場合は翻訳すると画面と説明が食い違う。
    where: "例: module-03/m1/m1.3.adoc の \"Check Database\" ボタンラベル。"

  - rule: "AsciiDocのブロックタイトル（`.Title` 構文）は、ピリオドの直後にスペースを入れない。"
    why: "`. text`（スペースあり）は番号付きリストの項目として解釈されてしまい、[%collapsible] 等のタイトルが失われる。"
    where: 翻訳時に「.」の後ろへ誤ってスペースを挿入しやすいので要注意。

  - rule: 他ページの見出しへのリンク文言（xref）・ナビゲーション（nav.adoc）・テーブル内の表記は、リンク先ページの実際の見出しと一致させる。
    why: 同じ概念が文書内で複数の訳語に分かれると、読者が同一のセクションを指しているとわかりにくくなる。
    where: 見出し・nav.adoc・「次のステップ」リンク・所要時間テーブルなど、見出しを引用する全箇所。

  - rule: ラテン文字（英単語）と日本語（カタカナ/漢字/ひらがな）の間には半角スペースを入れ、日本語同士の間にはスペースを入れない。
    why: プロジェクト全体で統一されている表記スタイル。
    where: "例: 「Developer Hub にログイン」（英単語の前後にスペース）、「名前空間を保護する」（スペースなし）。"

  - rule: URL（`https://...` や `{rhdh_url}` などURLに展開される属性）を日本語の直後に置く場合は、URLの前に半角スペースを入れる。
    why: >-
      Asciidoctor は、URL の直前が空白・行頭・括弧などの場合にのみ自動リンクとして認識する。
      「、」「は」などの日本語の文字の直後に URL があるとリンクにならず、
      `https://...[リンク文言^]` が括弧ごと文字としてそのまま表示されてしまう。
    where: >-
      例: 「選択するか、 {rhdh_url}[{rhdh_url}^] で」（誤: 「選択するか、{rhdh_url}[...]」）、
      「は、 {gitlab_url}/parasol/conforma-policies[...]」。
      module-01/02-developer-experience.adoc、module-02/04-promotion.adoc など、URL属性を本文中で使う箇所全般。
      `link:` マクロや `xref:` はこの制約を受けない。

  - rule: 翻訳した名詞を別の名詞と複合させて「AのB」の関係（所有・所属・用途）を表す場合は、助詞「の」を省略しない。
    why: >-
      「データベース名前空間」のように名詞を直接並べると、「データベース専用の名前空間」なのか
      「データベースという名前の名前空間」なのか曖昧になり、不自然な複合語に読めてしまう。
    where: >-
      例: 「データベースの名前空間」（誤: データベース名前空間）、「プロジェクトの名前空間」（誤: プロジェクト名前空間）、
      「image の名前空間」。
      ただし「本番名前空間」「secured-prod 名前空間」のように、定着した接頭語やハイフン付きの固有リソース名が
      直接前置される場合は、複合させてよい（既存の訳語として定着しているため）。

  - rule: 英語の過去分詞・現在分詞（isolated, secured など）を日本語化する際は、名詞をそのまま複合させず、活用形（〜された、〜する）で名詞を修飾する。
    why: 動詞由来の語を名詞のまま複合させると、専門用語の省略形のように読めてしまい不自然。
    where: "例: 「隔離された名前空間」（誤: 隔離名前空間）。"

# ------------------------------------------------------------------
# 用語集 (en -> ja)
# ------------------------------------------------------------------
# 各エントリーの項目:
#   en:    英語の原語
#   ja:    統一した日本語訳
#   notes: 採用理由や例外、適用範囲などの補足
terms:
  - en: Developer Experience
    ja: 開発者エクスペリエンス
    notes: >-
      index.adoc / module-01/00-intro.adoc / module-01/02-developer-experience.adoc で
      「開発者の体験」「開発者体験」「開発者エクスペリエンス」の3通りに分かれていたため統一。

  - en: namespace
    ja: 名前空間
    notes: >-
      module-02で先に統一し、module-03 (intro.2.adoc, m1.1.adoc)・module-05にも展開。
      YAML中のリテラルなキー名 `namespace:` など、翻訳してはいけないフィールド名・リソース名は対象外。
      他の名詞と複合させる場合は助詞「の」の省略ルールに従うこと（例: 「データベースの名前空間」）。

  - en: service account
    ja: サービスアカウント
    notes: >-
      Kubernetesのリソース名としての技術用語。単体の「service」（→サービス）とは別語として扱う。

  - en: Dealing with vulnerabilities early (ページ見出し)
    ja: 脆弱性に早期に対処する
    notes: module-02/01-vulnerabilities.adoc へのリンク文言・テーブル表記をこの見出しに統一。

  - en: Checking the sandbox pipeline (ページ見出し)
    ja: Sandbox pipeline を確認する
    notes: module-02/03-sandbox-pipeline.adoc の見出し・リンク文言・テーブル表記を統一。

  - en: Securing your namespaces (ページ見出し)
    ja: 名前空間を保護する
    notes: "module-02/05-namespace-security.adoc の見出し・リンク文言・テーブル表記を統一（旧: 「Namespaceを保護する」）。"

  - en: "... platform onboarding (Matrix / Rocket.Chat)"
    ja: "...プラットフォームのオンボーディング"
    notes: >-
      module-03/m2/m2.1.adoc, m2.2.adoc の見出しに合わせ、他ページからのリンク文言を統一。
      nav.adoc のみ「...プラットフォームへのオンボーディング」（助詞「へ」）で、これは意図的にnav内で統一された別表記。

  - en: Setup the Lab working folder (ページ見出し)
    ja: ラボの作業フォルダーをセットアップする
    notes: module-03/m3.1, m4.1, m5.1 の見出しとnav.adocの3箇所に統一。

  - en: lab
    ja: ラボ
    notes: 演習・ワークショップの文脈での一般名詞。ディレクトリツリー内の実際のフォルダー名「lab」など、リテラルな名称は対象外。

  - en: step
    ja: ステップ
    notes: >-
      `step N` のようなコマンド名・CLI引数リテラルは翻訳しない
      （例: `step 9` はそのまま、文中の「ステップ N」は日本語化）。

  - en: workshop
    ja: ワークショップ

  - en: helper script
    ja: ヘルパースクリプト

  - en: workspace
    ja: ワークスペース

  - en: dashboard
    ja: ダッシュボード

  - en: cluster
    ja: クラスター

  - en: container
    ja: コンテナ

  - en: plugin
    ja: プラグイン

  - en: instance
    ja: インスタンス

  - en: command
    ja: コマンド
    notes: インラインコードのリテラルなコマンド例（バッククォート内）は翻訳しない。

  - en: query
    ja: クエリー

  - en: service
    ja: サービス
    notes: >-
      Kubernetesのリソース種別としての固有名詞「Service」（例: 表内の「Service (自動作成)」）は翻訳しない。
      一般名詞としての「a service / the service」のみ対象。

  - en: commit
    ja: コミット
    notes: >-
      module-02/03-sandbox-pipeline.adoc, 04-promotion.adoc で特に多数未翻訳のまま残っていたため統一。
      「commit message」→「コミットメッセージ」、「commit comment」→「コミットのコメント」、
      「commit report」→「コミットレポート」のように複合語も訳す。
      ただし `verify-commit-signature`・`report-to-commit`・`parasol-signed-commit-required` などの
      リテラルなタスク名・ポリシー名、`commit.gpgsign` のような Git 設定キー名、
      画像ファイル名（例: `m02-devspaces-commit.png`）は対象外。

  - en: attestation
    ja: アテステーション
    notes: >-
      module-02/04-promotion.adoc, 01a-environment.adoc で未翻訳のまま残っていたため統一
      （05-namespace-security.adoc, 00-intro.adoc では既に「アテステーション」が使われていた）。
      「SLSA attestation」→「SLSA アテステーション」、「SLSA provenance attestation」→「SLSA provenance アテステーション」、
      「in-toto attestation」→「in-toto アテステーション」のように、製品名・仕様名はそのまま残し、
      一般名詞部分のみ訳す。ただし「Attestation Detail」「Attestation signature check」のように、
      実際のUI・出力に表示される文字列を模したボールド表記は翻訳しない。

  - en: component
    ja: コンポーネント
    notes: >-
      module-02/04-promotion.adoc で未翻訳のまま残っていたため統一（他ファイルでは既に「コンポーネント」が定着）。
      Camel のプロパティキー（例: `camel.component.langchain4j-agent...`）や画像ファイル名
      （例: `m02-rhdh-secured-component.png`）内の literal な "component" は対象外。

  - en: image (container image)
    ja: イメージ
    notes: >-
      module-02/03-sandbox-pipeline.adoc, 04-promotion.adoc で特に多数未翻訳のまま残っていたため統一
      （05-namespace-security.adoc, 01a-environment.adoc では既に「イメージ」が定着）。
      「base image」→「ベースイメージ」、「container image」→「コンテナイメージ」、
      「image scan」→「イメージスキャン」のように複合語も訳す。
      ただし `image::`（AsciiDocの画像挿入マクロ）、`--image=docker.io/...` のようなリテラルな
      CLIフラグ、`acs-image-scan`・`acs-image-check` などのリテラルなタスク名、
      `parasol-image-signature-required` のようなリテラルなポリシー名、
      `**Image signature check**` のような実際のConforma出力ラベルを模したボールド表記、
      コピペ用コードブロック内の文字列は対象外。

  - en: sandbox
    ja: サンドボックス
    notes: >-
      module-02/01-vulnerabilities.adoc, 04-promotion.adoc, 02-commit-signing.adoc,
      05-namespace-security.adoc, 01a-environment.adoc では、環境を指す一般名詞としての
      "sandbox" を「サンドボックス」に統一する（例: 「サンドボックスとは異なり」）。

      例外: module-02/03-sandbox-pipeline.adoc だけは "sandbox" を英語のまま維持する。
      このファイルでは「Sandbox pipeline」（ページタイトル・見出し・本文で確立された
      Tekton pipeline のステージ名）と、「sandbox branch」のように一般名詞として使われる
      "sandbox" が混在しており、確実に見分けるのが難しいため、ファイル全体で統一して
      英語のまま残すことで合意した（例: 「sandbox の外では」「sandbox branch」「sandbox では
      強制されません」）。ただし同ファイル内でも「component」など他の確定した用語の翻訳は
      維持し、"sandbox" 部分だけ英語にする（例: 「sandboxコンポーネント」）。
      `**Sandbox Build Results**` のような実際のGitLabコメント出力ラベルを模した
      ボールド表記、コピペ用ログ出力ブロック内の "sandboxes" はどのファイルでも対象外。

  - en: comment
    ja: コメント
    notes: >-
      module-02/03-sandbox-pipeline.adoc に1箇所未翻訳で残っていたため統一
      （「commit comment」→「コミットのコメント」は commit の項目を参照）。

  - en: package manager
    ja: パッケージマネージャー
    notes: module-02/03-sandbox-pipeline.adoc の2箇所が未翻訳で残っていたため統一。

  - en: terminal
    ja: ターミナル

  - en: timeout
    ja: タイムアウト
    notes: "CLIフラグ名（例: `--connect-timeout`）やログ出力中のリテラル文字列は対象外。"

  - en: mesh
    ja: メッシュ

  - en: key pair
    ja: キーペア
    notes: module-02/02-commit-signing.adoc で「鍵ペア」となっていたため「キーペア」に統一。

  - en: keyless (signature / signing)
    ja: キーレス署名
    notes: >-
      module-02/02-commit-signing.adoc で「鍵レス」という誤記があったため「キーレス」に統一。
      英語の signature（名詞: 署名そのもの）と signing（動名詞: 署名する行為・方式）は、
      日本語の「署名」がどちらの意味も自然にカバーできるため、訳し分けずどちらも「キーレス署名」とする。

  - en: network policy
    ja: ネットワークポリシー

  - en: firewall rule
    ja: ファイアウォールルール

  - en: deploy
    ja: デプロイ（する）
    notes: 既存訳との整合のため、英語の「deploy」をそのまま残さずカタカナ動詞化する。

# ------------------------------------------------------------------
# 未確定事項（方針が決まっていない表記ゆれ）
# ------------------------------------------------------------------
# 各エントリーの項目:
#   topic:   論点
#   example: 具体例
#   notes:   現状の扱いと今後の検討メモ
open_questions:
  - topic: 英語の形容詞（local, remote, secure など）とカタカナ化した名詞（サービス, メッシュ など）の混在表記
    example: "\"local サービス\"、\"remote サービス\"、\"secure メッシュ\"（module-03/m1/m1.1.adoc）"
    notes: >-
      日本語のIT文書としては許容範囲内だが、ネイティブの技術ライターなら名詞ごとカタカナ化する
      （例: ローカルサービス）か、句全体を英語のまま残すことが多く、現状はやや不統一。
      方針は未確定。同様の表現が増えてきた場合は、ここに追記したうえで統一方針を検討する。

# ------------------------------------------------------------------
# 既知の例外（統一ルールを意図的に適用していない箇所）
# ------------------------------------------------------------------
exceptions:
  - en: "Onboard onto the Matrix and Rocket.Chat platforms"
    ja: "...プラットフォームを利用開始し"
    location: module-03/index.adoc (タイルの説明文)
    notes: >-
      他の箇所では「オンボーディング」に統一しているが、
      タイルの説明文としての自然さを優先し「利用開始」のまま維持することで合意済み。
